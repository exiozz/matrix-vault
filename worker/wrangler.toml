name = "matrix-vault"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GH_REPO = "exiozz/vault-data"
ALLOWED_ORIGIN = "https://exiozz.github.io"

# Secrets (npx wrangler secret put <NOM>) :
#   GH_TOKEN  token GitHub fine-grained, Contents: Read & write sur exiozz/vault-data uniquement
#   SEED      longue chaîne aléatoire : génère les codes et signe sessions/liens — la même dans bot/.env
